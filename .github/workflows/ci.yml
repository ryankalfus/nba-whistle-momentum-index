name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: >-
          ruff check forecast_foul_sequences.py run_all_wmi_hypotheses.py
          run_wmi_expansion_analysis.py validate_wmi.py validate_wmi_intervals.py
          wmi_possessions.py wmi_utils.py tests/test_all_wmi_hypotheses.py
          tests/test_wmi_validation.py

      - name: Test
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Website unit checks
        run: node tests/test_site.cjs
